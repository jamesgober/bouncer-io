# =============================================================================
#  R E P S   ·   bouncer-io
# =============================================================================
[package]
name    = "bouncer-io"
version = "0.4.0"

# Minimum Supported Rust Version (MSRV)
rust-version = "1.85"
edition = "2024"

# License
license = "Apache-2.0 OR MIT"

# Readme
readme = "README.md"

# Files kept out of the published package
exclude = ["fuzz/", ".github/"]

# Description
description = "Connection gate for Rust services: admission by address, prefix, fingerprint, session, and account; in-flight revocation through cheap checkpoints; wipe, replace, and eject of revoked requests; ban memory with prefix escalation. Protocol-free."

# Keywords (5 max)
keywords = ["security", "firewall", "ban", "network", "gate"]

# Categories
categories = ["network-programming"]

# Links
homepage      = "https://github.com/jamesgober/bouncer-io"
repository    = "https://github.com/jamesgober/bouncer-io"
documentation = "https://docs.rs/bouncer-io"

# Authors
authors = ["James Gober <me@jamesgober.com>"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "bouncer_io"
path = "src/lib.rs"


# FEATURE FLAGS
# #################################
[features]
default = []


# DEPENDENCIES
# #################################
[dependencies]
# Monotonic and wall time, mockable in tests (first-party).
clock-lib = "1.1"
# GCRA rate math for door budgets (first-party). Default features off: its
# `std` feature pulls ahash and hashbrown.
rate-net = { version = "2.0", default-features = false }
# Guaranteed (volatile) wipe of response buffers: the audited-cryptography
# exception. Only the features bouncer uses.
crypt-io = { version = "1.2", default-features = false, features = ["zeroize", "mac-blake3"] }


# DEV DEPENDENCIES
# #################################
[dev-dependencies]
criterion = { version = "0.7", default-features = false }
proptest = { version = "1", default-features = false, features = ["std"] }

[target.'cfg(bouncer_loom)'.dev-dependencies]
loom = "0.7"


# BENCHMARKS
# #################################
[[bench]]
name    = "door"
harness = false


# LINTS
# #################################
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(bouncer_loom)"] }


# RELEASE PROFILE
# #################################
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
