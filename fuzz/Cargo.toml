[package]
name = "bouncer-io-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
bouncer-io = { path = ".." }

# Keep the fuzz crate out of the parent package and workspace.
[workspace]
members = ["."]

[[bin]]
name = "cidr_parse"
path = "fuzz_targets/cidr_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "directive_sequence"
path = "fuzz_targets/directive_sequence.rs"
test = false
doc = false
bench = false

[[bin]]
name = "snapshot_decode"
path = "fuzz_targets/snapshot_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "journal_replay"
path = "fuzz_targets/journal_replay.rs"
test = false
doc = false
bench = false

[[bin]]
name = "delta_decode"
path = "fuzz_targets/delta_decode.rs"
test = false
doc = false
bench = false
