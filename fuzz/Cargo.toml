[package]
name = "bouncer-io-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
bouncer-io = { path = ".." }

# Keep the fuzz crate out of the parent package and workspace.
[workspace]
members = ["."]

[[bin]]
name = "cidr_parse"
path = "fuzz_targets/cidr_parse.rs"
test = false
doc = false
bench = false
